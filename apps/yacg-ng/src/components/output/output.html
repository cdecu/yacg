<div class="output-header">
  <select class="fmt" id="fmt" [(ngModel)]="selectedFmt">
    @for (p of formats; track p) {
    <option [value]="p">{{ p }}</option>
    }
  </select>
</div>

<div class="output-editor">
  <ngx-monaco-editor
    class="editor"
    [options]="OutputOptions()"
    [ngModel]="data"
  ></ngx-monaco-editor>
</div>
